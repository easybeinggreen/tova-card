<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Tova!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3d3226; --paper:#fbf3e0; --moss:#5f9e57; --rose:#e58a8a; --sun:#f6c760;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ea;color:var(--ink);
    font-family:'Quicksand',system-ui,sans-serif}
  .hand{font-family:'Caveat','Segoe Script',cursive}

  #stage{position:fixed;inset:0;overflow:hidden;
    background:linear-gradient(#7fbfe0 0%,#b5deea 42%,#fbe9c9 78%)}
  /* paper grain over everything for a painted feel */
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.22;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>")}

  .sun{position:absolute;right:9vw;top:7vh;width:20vmin;height:20vmin;border-radius:50%;
    background:radial-gradient(circle,#fff6cf 0 30%,#ffe9a0 31% 55%,rgba(255,233,160,0) 72%);
    animation:glow 6s ease-in-out infinite}
  @keyframes glow{50%{transform:scale(1.08);opacity:.9}}

  .layer{position:absolute;left:0;bottom:0;will-change:transform;
    transition:transform 1.8s cubic-bezier(.45,.05,.25,1)}
  #clouds{top:0;height:50vh;width:300vw}
  .cloud{position:absolute;width:26vmin;opacity:.92;animation:drift 40s linear infinite alternate}
  @keyframes drift{to{transform:translateX(6vw)}}
  #hills1{width:300vw;height:100%}
  #hills2{width:300vw;height:100%}
  .hills{position:absolute;left:0;width:100%}

  #ground{position:absolute;left:0;right:0;bottom:0;height:22vh;
    background:linear-gradient(#6fa552,#4f7f3b 70%,#456f34);z-index:2}
  #groundtop{position:absolute;left:0;right:0;bottom:calc(22vh - 1px);height:5vh;width:100%;z-index:2}

  #world{position:absolute;left:0;bottom:0;height:100%;width:520vw;z-index:3;
    transition:transform 1.8s cubic-bezier(.45,.05,.25,1);will-change:transform}
  .it{position:absolute;bottom:17vh}
  .it svg,.paint{filter:url(#paint)}
  .it svg{display:block;width:100%;height:auto;overflow:visible}

  /* animals */
  .animal{cursor:pointer;transition:transform .2s}
  .animal:hover{transform:translateY(-1vmin) scale(1.04)}
  .animal.hop{animation:hop .6s ease}
  @keyframes hop{30%{transform:translateY(-6vmin)}60%{transform:translateY(0)}80%{transform:translateY(-2vmin)}}
  .say{position:absolute;left:50%;bottom:105%;transform:translateX(-50%);white-space:nowrap;z-index:5;
    background:var(--paper);border:2px solid var(--ink);border-radius:2vmin;padding:.7vmin 1.8vmin;
    font-family:'Caveat',cursive;font-size:max(20px,3.6vmin);animation:pop .3s ease both}
  .say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
  @keyframes pop{from{transform:translateX(-50%) scale(.3);opacity:0}}
  .bird{animation:flap 3.5s ease-in-out infinite}
  @keyframes flap{50%{transform:translateY(-3vmin) rotate(-3deg)}}
  .fly{animation:flit 7s ease-in-out infinite}
  @keyframes flit{0%,100%{transform:translate(0,0)}25%{transform:translate(4vmin,-3vmin)}50%{transform:translate(8vmin,1vmin)}75%{transform:translate(3vmin,-4vmin)}}
  .wing{transform-box:fill-box;transform-origin:center;animation:wing .35s ease-in-out infinite alternate}
  @keyframes wing{to{transform:scaleX(.35)}}
  .sway{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(1.6deg)}}
  .ears{transform-box:fill-box;transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}
  @keyframes ear{45%,55%{transform:rotate(-6deg)}}

  /* cottage */
  #finale{position:absolute;bottom:0;height:100%}
  #rainbow{position:absolute;bottom:17vh;left:0;width:132vmin;opacity:.85}
  #cottage{position:absolute;bottom:17vh;width:58vmin}
  #cottage svg{width:100%;display:block;overflow:visible}
  #door{cursor:pointer;transform-box:fill-box;transform-origin:left center;transition:transform 1s ease}
  .open #door{transform:scaleX(.16)}
  .hint #doorglow{animation:ring 1.6s ease-in-out infinite}
  #doorglow{fill:none;stroke:#fff3b0;stroke-width:4;opacity:0}
  .hint #doorglow{opacity:1}
  @keyframes ring{50%{stroke-width:10;opacity:.4}}
  #knock{position:absolute;left:50%;top:36%;transform:translateX(-50%);z-index:6;text-align:center;white-space:nowrap;
    background:var(--paper);border:3px solid var(--ink);border-radius:2vmin;padding:.6vmin 2vmin;line-height:1;
    font-family:'Caveat',cursive;font-weight:700;font-size:4.6vmin;box-shadow:0 .6vmin 0 rgba(61,50,38,.4);
    opacity:0;pointer-events:none;transition:opacity .4s}
  #knock small{font-size:3.2vmin;font-weight:600}
  .hint #knock{opacity:1;animation:bounce 1s ease-in-out infinite}
  @keyframes bounce{50%{transform:translate(-50%,-1.6vmin)}}
  #knocktext{position:absolute;left:50%;top:52%;transform:translateX(-50%);z-index:6;font-family:'Caveat',cursive;font-weight:700;
    font-size:6vmin;color:#fff;-webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;opacity:0}
  #knocktext.on{animation:knockpop .3s ease-out}
  @keyframes knockpop{from{opacity:1;transform:translate(-50%,0) scale(.5)}to{opacity:0;transform:translate(-50%,-4vmin) scale(1.4)}}
  .knocking #door{animation:knock .3s ease-in-out 3}
  @keyframes knock{30%{transform:translateX(-.8vmin) rotate(-1deg)}60%{transform:translateX(.4vmin)}}
  .smoke circle{animation:smoke 4s ease-out infinite;opacity:0}
  .smoke circle:nth-child(2){animation-delay:1.3s}.smoke circle:nth-child(3){animation-delay:2.6s}
  @keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(14px,-70px) scale(1.8);opacity:0}}

  /* Tova walking */
  #girl{position:absolute;left:7vw;bottom:15vh;width:15vmin;z-index:4;transform-origin:50% 100%}
  #girl svg{display:block;width:100%;overflow:visible}
  #girl .leg{transform-box:fill-box;transform-origin:50% 0}
  .walk #girl{animation:bob .45s ease-in-out infinite}
  .walk #girl .l1{animation:step .45s ease-in-out infinite alternate}
  .walk #girl .l2{animation:step .45s ease-in-out infinite alternate-reverse}
  @keyframes bob{50%{transform:translateY(-1.2vmin)}}
  @keyframes step{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}

  /* UI */
  #caption{position:absolute;left:50%;top:5vh;transform:translateX(-50%);z-index:20;text-align:center;
    width:min(90vw,60rem);pointer-events:none}
  #caption h1{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:clamp(34px,9vmin,96px);line-height:1;
    color:#fff;text-shadow:0 3px 0 rgba(61,50,38,.55),0 0 18px rgba(61,50,38,.25)}
  #caption p{display:inline-block;margin:1.2vmin 0 0;background:var(--paper);border:2px solid var(--ink);
    border-radius:2.4vmin;padding:1vmin 2.6vmin;font-family:'Caveat',cursive;font-weight:600;
    font-size:clamp(22px,4.4vmin,44px);box-shadow:0 .6vmin 0 rgba(61,50,38,.35);transition:opacity .4s}
  #caption p.fade{opacity:0}
  #nav{position:absolute;left:0;right:0;bottom:5vh;z-index:20;display:flex;gap:12px;justify-content:center;align-items:center}
  button{font:inherit;cursor:pointer;color:var(--ink)}
  #go{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(24px,5vmin,48px);padding:.5vmin 3vmin 1vmin;
    background:var(--sun);border:3px solid var(--ink);border-radius:999px;box-shadow:0 .8vmin 0 var(--ink);
    transition:transform .1s,box-shadow .1s,opacity .4s}
  #go:active{transform:translateY(.6vmin);box-shadow:0 .2vmin 0 var(--ink)}
  #go.gone{opacity:0;pointer-events:none}
  #back{width:clamp(38px,6vmin,56px);aspect-ratio:1;border-radius:50%;background:var(--paper);border:2px solid var(--ink);font-size:20px}
  #back[hidden]{display:none}
  .dots{position:absolute;bottom:1.6vh;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);border:1.5px solid var(--ink)}
  .dots i.on{background:var(--rose)}

  /* reveal */
  #reveal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30vmin 3vw 4vh;overflow:auto;
    background:radial-gradient(ellipse at 50% 40%,#ffe9b0 0%,#f8c98a 55%,#e6a06d 100%);
    clip-path:circle(0 at var(--x,50%) var(--y,60%));transition:clip-path 1.3s ease-in;visibility:hidden}
  #reveal.show{clip-path:circle(150% at var(--x,50%) var(--y,60%));visibility:visible}
  .bunting{position:absolute;top:0;left:0;width:100%;height:14vmin;z-index:2}
  .sign{position:absolute;top:10.5vmin;left:50%;z-index:3;transform-origin:50% -6vmin;transform:translateX(-50%);
    animation:swing 3.6s ease-in-out infinite alternate;
    padding:.8vmin 4vmin 1.4vmin;border:.5vmin solid var(--ink);border-radius:2vmin;
    background:linear-gradient(#ffe08a,#f6c760);box-shadow:0 1vmin 0 rgba(61,50,38,.35);
    font-family:'Caveat',cursive;font-weight:700;font-size:clamp(28px,7vmin,80px);line-height:1;white-space:nowrap;color:var(--ink)}
  .sign::before,.sign::after{content:"";position:absolute;bottom:100%;width:.45vmin;height:6.6vmin;background:var(--ink);transform-origin:50% 100%}
  .sign::before{left:16%;transform:rotate(8deg)}.sign::after{right:16%;transform:rotate(-8deg)}
  .sign b{font-size:1.35em;display:inline-block;vertical-align:-.05em;color:#e8655f;-webkit-text-stroke:.5vmin var(--ink);paint-order:stroke fill;
    animation:jig 1.4s ease-in-out infinite}
  @keyframes swing{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}
  .rt span{display:inline-block;-webkit-text-stroke:.9vmin var(--ink);paint-order:stroke fill;animation:jig 2.2s ease-in-out infinite}
  .rt .sp{width:.28em;-webkit-text-stroke:0;animation:none}
  #caption h1.rt span{-webkit-text-stroke:.8vmin var(--ink)}
  @keyframes jig{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.2vmin) rotate(-3deg)}}
  #streamers,#balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #streamers{z-index:31}
  #balloons{z-index:0}
  #reveal h2,#reveal .msg,#reveal .fam,#again{position:relative;z-index:1}
  .streamer{position:absolute;top:-2vh;transform-origin:50% 0;animation:sway2 3.5s ease-in-out infinite alternate}
  .streamer svg{display:block;width:100%;height:100%;transform-origin:50% 0;animation:unroll 1.8s ease-out both}
  @keyframes unroll{from{transform:scaleY(0)}}
  @keyframes sway2{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  .balloon{position:absolute;bottom:-24vmin;width:11vmin;pointer-events:auto;cursor:pointer;animation:rise2 linear forwards}
  .balloon svg{display:block;width:100%;overflow:visible;animation:bsway 2.4s ease-in-out infinite alternate}
  @keyframes rise2{to{transform:translateY(-150vh)}}
  @keyframes bsway{from{transform:translateX(-2vmin) rotate(-5deg)}to{transform:translateX(2vmin) rotate(5deg)}}
  #reveal h2{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:clamp(46px,13vmin,140px);line-height:.95;color:#fff;letter-spacing:.01em}
  #reveal .msg{max-width:36rem;margin:1.6vmin 0 0;font-family:'Caveat',cursive;font-weight:600;font-size:clamp(22px,4.2vmin,40px);line-height:1.15}
  .fam{display:flex;flex-wrap:wrap;justify-content:center;gap:2vmin 2.2vmin;margin:2.4vmin 0 1vmin;max-width:98vw}
  .member{width:clamp(92px,17.5vmin,190px);opacity:0;transform:translateY(30px) scale(.8)}
  .show .member{animation:rise .7s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .member .frame{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff6dc;
    border:4px solid var(--paper);box-shadow:0 0 0 3px var(--ink),0 1vmin 2vmin rgba(61,50,38,.3)}
  .member svg,.member img{width:100%;height:100%;display:block;object-fit:cover}
  .member img{filter:saturate(1.15) contrast(.94) sepia(.14) brightness(1.03)}
  .member .arm{transform-origin:76px 94px;animation:wave 1s ease-in-out infinite alternate}
  .member:nth-child(even) .arm{animation-duration:.8s;animation-delay:-.3s}
  @keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(24deg)}}
  .member b{display:block;margin-top:1vmin;font-family:'Caveat',cursive;font-size:clamp(24px,4.6vmin,44px);line-height:1}
  #again{margin-top:2vmin;font-family:'Caveat',cursive;font-size:clamp(20px,3.4vmin,32px);background:var(--paper);
    border:2px solid var(--ink);border-radius:999px;padding:.4vmin 2.4vmin .8vmin;box-shadow:0 .5vmin 0 var(--ink)}
  #confetti{position:absolute;inset:0;z-index:40;pointer-events:none}

  @media (prefers-reduced-motion:reduce){
    .layer,#world{transition-duration:.01s}
    .cloud,.sun,.bird,.fly,.sway,.ears,.smoke circle,.member .arm{animation:none}
  }
</style>
</head>
<body>

<!-- ============ shared drawings ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>

    <symbol id="tree1" viewBox="0 0 120 170">
      <path d="M54 170 Q56 130 52 100 L68 100 Q64 130 68 170Z" fill="#7a5230"/>
      <path d="M60 118 Q80 108 88 92" stroke="#7a5230" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="35" cy="85" r="30" fill="#6fae5f"/><circle cx="88" cy="85" r="30" fill="#4f8f4f"/>
      <circle cx="60" cy="58" r="40" fill="#5f9e57"/><circle cx="60" cy="42" r="26" fill="#7dbb68" opacity=".85"/>
      <circle cx="46" cy="36" r="10" fill="#b4de93" opacity=".6"/><circle cx="82" cy="70" r="8" fill="#b4de93" opacity=".4"/>
    </symbol>
    <symbol id="tree2" viewBox="0 0 100 170">
      <rect x="44" y="130" width="12" height="40" fill="#6e4a2c"/>
      <polygon points="50,70 100,140 0,140" fill="#3f7d5a"/>
      <polygon points="50,35 95,100 5,100" fill="#4b8b63"/>
      <polygon points="50,2 88,62 12,62" fill="#5a9b6f"/>
      <polygon points="50,2 66,30 40,24" fill="#9ccb9a" opacity=".5"/>
    </symbol>
    <symbol id="bush" viewBox="0 0 100 60">
      <circle cx="28" cy="38" r="22" fill="#5f9e57"/><circle cx="60" cy="34" r="26" fill="#6fae5f"/>
      <circle cx="80" cy="44" r="16" fill="#4f8f4f"/><circle cx="52" cy="24" r="8" fill="#b4de93" opacity=".5"/>
    </symbol>
    <symbol id="flower" viewBox="0 0 20 32">
      <path d="M10 32 Q9 22 10 14" stroke="#3f7a3a" stroke-width="2" fill="none"/>
      <g fill="currentColor"><circle cx="10" cy="6" r="4"/><circle cx="15" cy="10" r="4"/><circle cx="5" cy="10" r="4"/><circle cx="7" cy="15" r="4"/><circle cx="13" cy="15" r="4"/></g>
      <circle cx="10" cy="11" r="3" fill="#fff0a0"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 120 60">
      <g fill="#fff"><ellipse cx="60" cy="42" rx="52" ry="14"/><circle cx="38" cy="32" r="18"/><circle cx="64" cy="24" r="22"/><circle cx="88" cy="34" r="15"/></g>
    </symbol>

    <symbol id="rabbit" viewBox="0 0 100 110">
      <g class="ears"><ellipse cx="66" cy="30" rx="6" ry="18" transform="rotate(-8 66 30)" fill="#f3e9dc"/>
      <ellipse cx="66" cy="30" rx="3" ry="12" transform="rotate(-8 66 30)" fill="#f2b6b6"/>
      <ellipse cx="80" cy="32" rx="6" ry="17" transform="rotate(10 80 32)" fill="#f3e9dc"/>
      <ellipse cx="80" cy="32" rx="3" ry="11" transform="rotate(10 80 32)" fill="#f2b6b6"/></g>
      <ellipse cx="46" cy="84" rx="30" ry="22" fill="#f3e9dc"/><circle cx="18" cy="86" r="8" fill="#fff"/>
      <circle cx="72" cy="62" r="17" fill="#f7eee2"/>
      <circle cx="78" cy="59" r="2.6" fill="#3d3226"/><ellipse cx="86" cy="65" rx="3" ry="2" fill="#e58a8a"/>
      <circle cx="70" cy="68" r="4" fill="#f2b6b6" opacity=".6"/>
      <ellipse cx="66" cy="104" rx="12" ry="5" fill="#e8dccb"/><ellipse cx="34" cy="104" rx="10" ry="5" fill="#e8dccb"/>
    </symbol>
    <symbol id="fox" viewBox="0 0 150 100">
      <path d="M40 66 Q4 60 6 24 Q34 30 50 58Z" fill="#d9822b"/><path d="M6 24 Q10 12 22 14 Q20 26 12 32Z" fill="#fff6e8"/>
      <ellipse cx="66" cy="66" rx="36" ry="20" fill="#e08a30"/><ellipse cx="72" cy="74" rx="24" ry="9" fill="#fff0da" opacity=".7"/>
      <rect x="40" y="76" width="8" height="20" rx="3" fill="#5a3320"/><rect x="88" y="76" width="8" height="20" rx="3" fill="#5a3320"/>
      <polygon points="96,40 98,14 112,34" fill="#d9822b"/><polygon points="114,34 128,14 130,42" fill="#d9822b"/>
      <polygon points="100,34 100,22 108,32" fill="#3d3226" opacity=".7"/>
      <circle cx="112" cy="50" r="19" fill="#e08a30"/><ellipse cx="128" cy="57" rx="14" ry="8" fill="#fff0da"/>
      <circle cx="139" cy="55" r="3.2" fill="#3d3226"/><circle cx="114" cy="46" r="3" fill="#3d3226"/>
      <circle cx="116" cy="47" r="1" fill="#fff"/>
    </symbol>
    <symbol id="birdy" viewBox="0 0 70 50">
      <ellipse cx="34" cy="28" rx="22" ry="15" fill="#6aa9d8"/><circle cx="54" cy="20" r="11" fill="#7db8e4"/>
      <polygon points="63,18 74,22 63,25" fill="#f2a03d"/><circle cx="56" cy="18" r="2.2" fill="#3d3226"/>
      <path d="M14 30 L0 22 L2 36Z" fill="#4f8fbf"/><ellipse cx="32" cy="27" rx="12" ry="7" fill="#4f8fbf" transform="rotate(-15 32 27)"/>
      <ellipse cx="40" cy="36" rx="12" ry="6" fill="#fbe9c9" opacity=".8"/>
    </symbol>
    <symbol id="butterfly" viewBox="0 0 40 30">
      <g class="wing"><ellipse cx="13" cy="10" rx="11" ry="8" fill="#f28dbd"/><ellipse cx="13" cy="21" rx="8" ry="6" fill="#f7b3d6"/>
      <ellipse cx="27" cy="10" rx="11" ry="8" fill="#f28dbd"/><ellipse cx="27" cy="21" rx="8" ry="6" fill="#f7b3d6"/></g>
      <rect x="19" y="6" width="2" height="18" rx="1" fill="#3d3226"/>
    </symbol>
  </defs>
</svg>

<div id="stage">
  <div class="sun"></div>

  <div id="clouds" class="layer" style="bottom:auto;top:0">
    <svg class="cloud" style="left:8vw;top:12vh"><use href="#cloud"/></svg>
    <svg class="cloud" style="left:48vw;top:5vh;width:32vmin;animation-duration:55s"><use href="#cloud"/></svg>
    <svg class="cloud" style="left:95vw;top:16vh"><use href="#cloud"/></svg>
    <svg class="cloud" style="left:150vw;top:6vh;width:30vmin"><use href="#cloud"/></svg>
    <svg class="cloud" style="left:210vw;top:14vh"><use href="#cloud"/></svg>
  </div>

  <div id="hills1" class="layer">
    <svg class="hills" style="height:52vh;bottom:18vh" viewBox="0 0 1000 200" preserveAspectRatio="none">
      <path d="M0 200 V110 Q60 40 140 100 T300 90 T460 60 T620 105 T780 70 T1000 100 V200Z" fill="#a9cfb4"/>
    </svg>
  </div>
  <div id="hills2" class="layer">
    <svg class="hills" style="height:38vh;bottom:16vh" viewBox="0 0 1000 200" preserveAspectRatio="none">
      <path d="M0 200 V120 Q90 50 190 110 T380 100 T560 70 T740 115 T1000 85 V200Z" fill="#86b876"/>
    </svg>
  </div>

  <svg id="groundtop" viewBox="0 0 1000 40" preserveAspectRatio="none"><path d="M0 40 V22 Q80 0 170 16 T340 14 T520 20 T700 10 T880 18 T1000 12 V40Z" fill="#6fa552"/></svg>
  <div id="ground"></div>

  <div id="world">
    <!-- trees -->
    <div class="it sway" style="left:52vw;width:30vmin;bottom:15vh"><svg viewBox="0 0 120 170"><use href="#tree1"/></svg></div>
    <div class="it" style="left:72vw;width:22vmin"><svg viewBox="0 0 100 170"><use href="#tree2"/></svg></div>
    <div class="it sway" style="left:88vw;width:36vmin;bottom:14vh;animation-delay:-2s"><svg viewBox="0 0 120 170"><use href="#tree1"/></svg></div>
    <div class="it" style="left:110vw;width:24vmin"><svg viewBox="0 0 100 170"><use href="#tree2"/></svg></div>
    <div class="it" style="left:60vw;width:16vmin;bottom:13vh"><svg viewBox="0 0 100 60"><use href="#bush"/></svg></div>

<script>
/* ============ EDIT ME ============ */
const MESSAGE = "You are so loved, Tova. Here's to a magical year full of adventures, giggles and cake!";

// photo: put a file in ./photos and set e.g. "photos/nana.jpg". Leave null for an illustrated avatar.
const FAMILY = [
  { name: "Mum",     photo: null, skin: "#f3c9a5", hair: "#5b3a29", shirt: "#e58a8a", long: true },
  { name: "Dad",     photo: null, skin: "#e9b98f", hair: "#2f2a26", shirt: "#6aa9d8" },
  { name: "Stina",   photo: null, skin: "#f7d5b0", hair: "#ecc96e", shirt: "#f2c14e", long: true },   // long blond hair
  { name: "Mormor",  photo: null, skin: "#f5d3b3", hair: "#dcd8d2", shirt: "#b78be0", bun: true },
  { name: "Iain",    photo: null, skin: "#e9b98f", hair: "#3a2f28", shirt: "#5aa9a0" },
  { name: "Grandad", photo: null, skin: "#efc39c", hair: "#c9c4bd", shirt: "#79a75f" },
  { name: "Julie",   photo: null, skin: "#f3c9a5", hair: "#a5532e", shirt: "#f2a65a" },
  { name: "Paul",    photo: null, skin: "#dcae82", hair: "#7a4a2a", shirt: "#6f83c9" },
];

const STOPS = [
  { say: "A little adventure is waiting for you…", btn: "Begin the journey" },
  { say: "Through the whispering trees we go…",   btn: "Keep walking →" },
  { say: "Look! Tap the animals to say hello.",   btn: "Keep walking →" },
  { say: "The fox knows the way. Follow the rainbow!", btn: "Keep walking →" },
  { say: "Almost there… what's that over the rainbow?", btn: "Keep walking →" },
  { say: "Knock knock! Tap the door to knock!",  btn: null },
];
/* =================================== */

const $ = s => document.querySelector(s);
const PAL = ['#e8655f','#f5a04a','#f7d557','#8cc26a','#5db6d6','#6f83c9','#a586c9','#f28dbd'];
document.querySelectorAll('.rt').forEach(el => {
  el.innerHTML = [...el.textContent].map((ch, i) => ch === ' ' ? '<span class="sp">&nbsp;</span>'
    : `<span style="color:${PAL[i % PAL.length]};animation-delay:${i*.09}s">${ch}</span>`).join('');
});
// bunting rope with flags (skips the middle, where the sign hangs)
(() => {
  let g = '<path d="M0 8 Q500 90 1000 8" stroke="#3d3226" stroke-width="3" fill="none"/>';
  for (let i = 1; i < 16; i++) {
    const t = i/16, x = t*1000, y = (1-t)*(1-t)*8 + 2*(1-t)*t*90 + t*t*8;
    if (Math.abs(x-500) < 150) continue;
    g += `<polygon points="${x-22},${y-1} ${x+22},${y-1} ${x},${y+34}" fill="${PAL[i%PAL.length]}" stroke="#3d3226" stroke-width="2"/>`;
  }
  document.querySelector('#bunting').innerHTML = g;
})();
const stage = $('#stage'), world = $('#world'), line = $('#line'), go = $('#go'), back = $('#back');
let step = 0, opened = false;

// scatter flowers along the whole world
const flowerColors = ['#e58a8a','#f6c760','#b78be0','#ffffff','#f28dbd'];
$('#flowers').innerHTML = Array.from({length: 90}, (_, i) => {
  const c = flowerColors[i % flowerColors.length];
  const x = Math.random() * 420, y = 3 + Math.random() * 10, w = 2.4 + Math.random() * 2;
  return `<div class="it" style="left:${x}vw;bottom:${y}vh;width:${w}vmin;color:${c}"><svg viewBox="0 0 20 32"><use href="#flower"/></svg></div>`;
}).join('');

$('#dots').innerHTML = STOPS.map(() => '<i></i>').join('');

function shifts() {
  const W = innerWidth, fin = $('#finale'), cot = $('#cottage');
  const cottageX = fin.offsetLeft + cot.offsetLeft;
  return [0, .50*W, 1.0*W, 1.70*W, fin.offsetLeft - .01*W, cottageX - .22*W];
}

function apply(walk = true) {
  const s = shifts()[step];
  world.style.transform = `translate3d(${-s}px,0,0)`;
  $('#hills1').style.transform = `translate3d(${-s*.10}px,0,0)`;
  $('#hills2').style.transform = `translate3d(${-s*.25}px,0,0)`;
  $('#clouds').style.transform = `translate3d(${-s*.05}px,0,0)`;

  const st = STOPS[step];
  line.classList.add('fade');
  setTimeout(() => { line.textContent = st.say; line.classList.remove('fade'); }, 250);
  $('#title').style.display = step === 0 ? '' : 'none';
  go.classList.toggle('gone', !st.btn);
  if (st.btn) go.textContent = st.btn;
  back.hidden = step === 0;
  document.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i === step));
  stage.classList.toggle('hint', step === STOPS.length - 1);

  if (walk) { stage.classList.add('walk'); setTimeout(() => stage.classList.remove('walk'), 1800); }
}

const move = d => { if (opened) return; step = Math.max(0, Math.min(STOPS.length - 1, step + d)); apply(); };
go.onclick = () => move(1);
back.onclick = () => move(-1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); move(1); }
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'Enter' && step === STOPS.length - 1) openDoor();
});
let tx = null;
addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive: true});
addEventListener('touchend', e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1);
});
addEventListener('resize', () => apply(false));

// animals
document.querySelectorAll('.animal').forEach(a => a.addEventListener('click', () => {
  a.classList.remove('hop'); void a.offsetWidth; a.classList.add('hop');
  a.querySelector('.say')?.remove();
  const b = document.createElement('div'); b.className = 'say'; b.textContent = a.dataset.say;
  a.appendChild(b); setTimeout(() => b.remove(), 2200);
  burst(a.getBoundingClientRect().left + a.offsetWidth/2, a.getBoundingClientRect().top, 14);
}));

// door → knock, knock, knock → reveal
$('#door').addEventListener('click', openDoor);
$('#doorglow').addEventListener('click', openDoor);
function thump(delay) {
  try {
    const a = thump.ctx || (thump.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(60, t + .12);
    g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .16);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .18);
  } catch (e) {}
}
function openDoor() {
  if (opened) return; opened = true;
  stage.classList.remove('hint'); stage.classList.add('knocking');
  const kt = $('#knocktext');
  [0, 1, 2].forEach(n => setTimeout(() => {
    kt.textContent = n === 2 ? 'KNOCK!' : 'knock'; kt.classList.remove('on'); void kt.offsetWidth; kt.classList.add('on');
  }, n * 300));
  thump(0); thump(.3); thump(.6);
  setTimeout(() => {
    stage.classList.remove('knocking'); stage.classList.add('open');
    const r = $('#door').getBoundingClientRect(), rv = $('#reveal');
    rv.style.setProperty('--x', Math.min(innerWidth, Math.max(0, r.left + r.width/2)) + 'px');
    rv.style.setProperty('--y', Math.min(innerHeight, Math.max(0, r.top + r.height/2)) + 'px');
    setTimeout(() => {
      rv.classList.add('show');
      document.querySelectorAll('.member').forEach((m, k) => m.style.animationDelay = (0.7 + k*.15) + 's');
      startParty();
    }, 900);
  }, 1100);
}
$('#again').onclick = () => {
  stopParty(); $('#reveal').classList.remove('show'); stage.classList.remove('open');
  opened = false; step = 0; apply();
};

// family avatars
function avatar(p) {
  if (p.photo) return `<div class="frame"><img src="${p.photo}" alt="${p.name}"></div>`;
  return `<div class="frame"><svg viewBox="0 0 100 100" role="img" aria-label="${p.name}">
    <rect width="100" height="100" fill="#fbe9c9"/>
    ${p.long ? `<path d="M27 44 Q25 16 50 16 Q75 16 73 44 L76 80 Q50 72 24 80Z" fill="${p.hair}"/>` : ''}
    <path d="M14 100 Q16 72 50 70 Q84 72 86 100Z" fill="${p.shirt}"/>
    ${p.bun ? `<circle cx="50" cy="18" r="9" fill="${p.hair}"/>` : ''}
    <rect x="43" y="58" width="14" height="16" fill="${p.skin}"/>
    <circle cx="50" cy="44" r="19" fill="${p.skin}"/>
    <path d="M30 44 Q28 22 50 22 Q72 22 70 44 Q62 32 50 34 Q38 32 30 44Z" fill="${p.hair}"/>
    <circle cx="43" cy="46" r="2.2" fill="#3d3226"/><circle cx="57" cy="46" r="2.2" fill="#3d3226"/>
    <path d="M43 54 Q50 60 57 54" stroke="#a4553a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g class="arm"><rect x="72" y="44" width="10" height="50" rx="5" fill="${p.shirt}"/><circle cx="77" cy="42" r="7" fill="${p.skin}"/></g>
  </svg></div>`;
}
$('#fam').innerHTML = FAMILY.map(p => `<div class="member">${avatar(p)}<b>${p.name}</b></div>`).join('');
$('#msg').textContent = MESSAGE;

// confetti
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
function fit() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
fit(); addEventListener('resize', fit);
const cols = ['#e58a8a','#f6c760','#8cc26a','#5db6d6','#b78be0','#f28dbd','#ffffff'];
function burst(x, y, n = 30, spread = 1) {
  const k = devicePixelRatio;
  for (let i = 0; i < n; i++) parts.push({
    x: x*k, y: y*k, vx: (Math.random()-.5)*10*spread*k, vy: (-Math.random()*9-2)*k,
    w: (5+Math.random()*6)*k, h: (3+Math.random()*4)*k, r: Math.random()*6, vr: (Math.random()-.5)*.4,
    c: cols[Math.random()*cols.length|0], life: 0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function explode(x, y, n = 70) {
  const k = devicePixelRatio;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (3 + Math.random() * 11) * k;
    parts.push({ x: x*k, y: y*k, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 3*k,
      w: (5+Math.random()*6)*k, h: (3+Math.random()*4)*k, r: Math.random()*6, vr: (Math.random()-.5)*.4,
      c: cols[Math.random()*cols.length|0], life: 0 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function balloon() {
  const box = $('#balloons'); if (box.children.length > 16) return;
  const c = PAL[Math.random()*PAL.length|0], d = document.createElement('div');
  d.className = 'balloon';
  d.style.left = (Math.random()*92) + 'vw'; d.style.animationDuration = (9 + Math.random()*6) + 's';
  d.style.width = (9 + Math.random()*5) + 'vmin';
  d.innerHTML = `<svg viewBox="0 0 60 130"><path d="M30 98 Q24 112 32 128" stroke="#3d3226" stroke-width="1.4" fill="none"/>
    <ellipse cx="30" cy="40" rx="27" ry="34" fill="${c}" stroke="#3d3226" stroke-width="1.6"/><path d="M30 73 L24 82 H36Z" fill="${c}" stroke="#3d3226" stroke-width="1.4"/>
    <ellipse cx="20" cy="26" rx="6" ry="10" fill="#fff" opacity=".45" transform="rotate(20 20 26)"/></svg>`;
  d.onclick = () => { const r = d.getBoundingClientRect(); explode(r.left + r.width/2, r.top + r.height/3, 40); d.remove(); };
  d.onanimationend = e => { if (e.target === d) d.remove(); };
  box.appendChild(d);
}
function streamers() {
  const box = $('#streamers'); box.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const c = PAL[i % PAL.length], h = 30 + Math.random()*40, d = document.createElement('div');
    d.className = 'streamer';
    d.style.left = ((i < 8 ? i*3.4 : 100 - (i-8)*3.4 - 3) + Math.random()*1.5) + 'vw';
    d.style.height = h + 'vh'; d.style.width = '3.2vmin'; d.style.animationDelay = (-Math.random()*3) + 's';
    d.innerHTML = `<svg viewBox="0 0 40 300" preserveAspectRatio="none" style="animation-delay:${.7 + i*.08}s"><path d="M20 0 Q42 25 20 50 T20 100 T20 150 T20 200 T20 250 T20 300" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/></svg>`;
    box.appendChild(d);
  }
}
let party = [];
function startParty() {
  stopParty(); streamers();
  const W = () => innerWidth, H = () => innerHeight;
  [0, 250, 500, 750, 1000].forEach(t => party.push(setTimeout(() => explode(W()*(.1 + Math.random()*.8), H()*(.15 + Math.random()*.3), 80), t)));
  party.push(setInterval(() => explode(W()*(.05 + Math.random()*.9), H()*(.1 + Math.random()*.4), 60), 1800));
  party.push(setInterval(() => burst(Math.random()*W(), -10, 8, .4), 220));
  party.push(setInterval(balloon, 900));
  for (let i = 0; i < 6; i++) party.push(setTimeout(balloon, i*300));
}
function stopParty() {
  party.forEach(p => { clearTimeout(p); clearInterval(p); }); party = [];
  $('#balloons').innerHTML = ''; $('#streamers').innerHTML = ''; parts = [];
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  const k = devicePixelRatio;
  parts = parts.filter(p => p.y < cv.height + 20 && p.life < 400);
  for (const p of parts) {
    p.vy += .28*k; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}

apply(false);
</script>
